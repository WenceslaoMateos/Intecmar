                    <button class="mt-6 px-6 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">
                        Ver listado completo
                    </button>
                </div>
            `
        };

        const pageTitles = {
            dashboard: "Resumen General",
            solicitudes: "Gestión de Solicitudes",
            instituciones: "Gestión de Instituciones",
            actividades: "Gestión de Actividades",
            usuarios: "Base de Usuarios",
            proyectos: "Supervisión de Proyectos"
        };

        // --- FUNCIÓN DE CARGA DE VISTAS ---
        function loadView(viewName) {
            // 1. Update Title
            document.getElementById('page-title').textContent = pageTitles[viewName];

            // 2. Inject Content
            const container = document.getElementById('view-container');
            // Reset animation
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');
            
            container.innerHTML = views[viewName];

            // 3. Update Sidebar Active State
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const activeLink = document.getElementById(`link-${viewName}`);
            if(activeLink) activeLink.classList.add('active');
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadView('dashboard');
        });
    </script>
</body>
</html>
