# docker-compose.yml
services:
  # Servicio de Base de Datos
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: tesis_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Servicio Backend (NestJS)
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: tesis_db
    depends_on:
      - db

  # Servicio Frontend (React)
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: