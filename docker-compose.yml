# docker-compose.yml
services:
  # Servicio de Base de Datos
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: tesis_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"    # Accederás por el puerto 8080
    environment:
      PMA_HOST: db   # <--- Clave: le dice que se conecte al servicio "db"
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

  # Servicio Backend (NestJS)
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:                # <--- 1. Agregá esta instrucción
      - ./backend/.env       # <--- 2. Apuntá al archivo que creaste
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: tesis_db
    depends_on:
      - db

  # Servicio Frontend (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "5173:3000"
    volumes:
      # Sincroniza tu carpeta local ./frontend con /usr/src/app en el contenedor
      - ./frontend:/usr/src/app
      
      # Protegemos las carpetas clave para que no se pisen con las de tu PC
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - backend

volumes:
  db_data: